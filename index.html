<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Student Expense Tracker</h1>
    <p class="subtitle">Keep an eye on where your money goes.</p>

    <!-- Add expense form -->
    <form id="expense-form" novalidate>
      <div class="form-row">
        <div class="field">
          <label for="name">Expense name</label>
          <input type="text" id="name" placeholder="e.g. Lunch at canteen">
        </div>
        <div class="field">
          <label for="amount">Amount (₹)</label>
          <input type="number" id="amount" placeholder="e.g. 120" step="0.01">
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category">
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <p id="error" class="error"></p>
      <button type="submit" class="btn-add">Add Expense</button>
    </form>

    <!-- Filter + total -->
    <div class="summary">
      <div class="filter">
        <label for="filter">Show:</label>
        <select id="filter">
          <option value="All">All categories</option>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Shopping">Shopping</option>
          <option value="Education">Education</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="total">Total: <span id="total">₹0.00</span></div>
    </div>

    <!-- Expense list -->
    <ul id="expense-list"></ul>
    <p id="empty-msg" class="empty">No expenses to show yet.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
